---
name: Continuous Integration

# Trigger this workflow manually, by pushing commits to any branch, or
# by filing a pull request.
on:
  workflow_dispatch:
  push:
  pull_request:

permissions: read-all

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: ResearchDataCom/releng/pre-commit@3c81afa629c2e31f8d76a3c61222341ce39d2fa5 # v2.0.1
        with:
          access-app-id: ${{ vars.PRIVATE_REPOSITORY_ACCESS_APP_ID }}
          access-key: ${{ secrets.PRIVATE_REPOSITORY_ACCESS_KEY }}
      - uses: ResearchDataCom/releng/python-freeze@3c81afa629c2e31f8d76a3c61222341ce39d2fa5 # v2.0.1

  test:
    needs:
      - lint
    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    runs-on: ubuntu-latest
    steps:
      - uses: ResearchDataCom/releng/python-test@3c81afa629c2e31f8d76a3c61222341ce39d2fa5 # v2.0.1
        with:
          python-version: ${{ matrix.python-version }}

  release:
    # Prevent race conditions of more than one release job in case of
    # multiple pushes to the main branch in a short period of time.
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref_name }}
      cancel-in-progress: false
    needs:
      - test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: ResearchDataCom/releng/cz-bump@3c81afa629c2e31f8d76a3c61222341ce39d2fa5 # v2.0.1
    outputs:
      released: ${{ steps.release.outputs.released }}
      tag: ${{ steps.release.outputs.tag }}

  build:
    needs:
      - lint
      - test
      - release
    if: needs.release.outputs.released
    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.13"
    runs-on: ubuntu-latest
    steps:
      - uses: ResearchDataCom/releng/python-build@3c81afa629c2e31f8d76a3c61222341ce39d2fa5 # v2.0.1
        with:
          artifact-name: python-${{ matrix.python-version }}-build-artifacts
          python-version: ${{ matrix.python-version }}

  github:
    needs:
      - lint
      - test
      - release
      - build
    if: needs.release.outputs.released
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: ResearchDataCom/releng/publish-github@3c81afa629c2e31f8d76a3c61222341ce39d2fa5 # v2.0.1
        with:
          artifact-paths: requirements.txt,dist/*
          tag: ${{ needs.release.outputs.tag }}
