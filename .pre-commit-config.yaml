# Ignore temporary files/folders, but note that this doesn't always
# work.  Check each linter's documentation for any required
# tool-specific exclusions; cf. https://stackoverflow.com/a/75560858.
exclude: |-
  (?x)^(
      build.*|
      dist.*
  )$

repos:
  # Ensure commit messages use Conventional Commits formatting;
  # see also .commitlintrc.js.
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.23.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Check shell scripts, limiting output to errors and warnings.
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  # Check GitHub Actions workflows.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.8
    hooks:
      - id: actionlint

  # Check Python syntax.
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        additional_dependencies:
          # Keep the list of flake8 plugins in sync with
          # pyproject.toml.
          - dlint
          - flake8-bandit
          - flake8-bugbear
          - flake8-comprehensions
          - flake8-docstrings
          - flake8-eradicate
          - flake8-fixme
          - flake8-future-import
          - flake8-pytest-style
          - flake8-requirements

  # Sort Python imports.
  - repo: https://github.com/pycqa/isort
    rev: 7.0.0
    hooks:
      - id: isort

  # Reformat Python code after sorting imports.
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
